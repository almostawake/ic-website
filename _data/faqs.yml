- question: Do I need my own horse?
  answer: "Yes — most of our members have their own horse agisted here at Calgary Park. A typical week looks like a lesson for you and a schooling session for your horse with Nat, so you're both progressing together. It's a partnership approach — you build confidence while your horse stays in consistent work."

- question: What level do I need to be?
  answer: "Any level. We work with complete beginners through to riders preparing for competition. There's no minimum — just a willingness to learn and enjoy the journey."

- question: I'm nervous — is that okay?
  answer: "More than okay — it's one of the most common reasons people come to us. Nat specialises in working with nervous riders. We go at your pace, build your confidence gradually, and never push you past where you're comfortable."

- question: Do I have to compete?
  answer: "Absolutely not. Many of our riders are here purely to enjoy their horses. Competition support is available when and if you want it — there's zero pressure."

- question: Where are you located?
  answer: "Calgary Park, 180 Birchalls Lane, Berrima NSW 2577 — in the Southern Highlands, about 1.5 hours from Sydney. Beautiful country, great riding, and worth the drive."

- question: Can I visit before committing?
  answer: "Of course. Give Nat a call and come out for a look around. No pressure, no sales pitch — just a chat and a cuppa."
