<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ic-navy': '{{ site.data.brand.colors.primary }}',
            'ic-sky': '{{ site.data.brand.colors.secondary }}',
            'ic-blush': '{{ site.data.brand.colors.blush }}',
            'ic-sage': '{{ site.data.brand.colors.sage }}',
            'ic-terra': '{{ site.data.brand.colors.terracotta }}',
            'ic-linen': '{{ site.data.brand.colors.background }}',
            'ic-cloud': '{{ site.data.brand.colors.background_alt }}',
            'ic-text': '{{ site.data.brand.colors.text }}',
            'ic-muted': '{{ site.data.brand.colors.text_light }}',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
</head>
<body class="bg-ic-linen text-ic-text font-sans antialiased" x-data="{ mobileMenu: false }">
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
