- label: Agistment
  title: A safe, supported home for your horse
  description: "Calm, community-focused agistment with individual private paddocks, horse-safe fencing, twice daily feeding, checking and rugging. Your horse is in safe hands — so you can relax."

- label: Lessons
  title: Tailored to you, not a template
  description: "Bespoke training and lessons — whether you're rebuilding confidence, working on groundwork, or preparing to get back in the saddle. No rush, no assumptions."

- label: Horse Training
  title: Professional schooling, your way
  description: "Professional schooling aligned with your goals and your horse's temperament. Training is always done with care and in consultation with you — we respect the bond between you and your horse."

- label: Event Support
  title: You never have to do it alone
  description: "When you're ready, we'll help you load up, travel to events, and support you on the day. From your first outing to your personal best, we're right there with you."
