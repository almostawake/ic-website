- name: Alison
  horse: Darcy
  image: testimonial-alison.jpg
  alt: "Alison with her horse Darcy at the covered arena"
  herald:
    - "Inner Circle is a unique business, offering well above and beyond any other agistment centre in the area."
    - "It is my happy place. My horse is looked after as if he were Natalie's own — I leave each day knowing he's in the very best of hands."
  full:
    - "If you are looking for an agistment where the owner will support not only you but also your horse — in an environment suited to ground work in a covered arena, trail rides, a jumping area, single paddocks where the horses are fed twice daily and looked after as if they are Natalie's own horses — Inner Circle is a unique business offering well above and beyond any other agistment centre in the area."
    - "It is my happy place, and I leave each day knowing my horse is in the very best of hands. I love my lessons with Nat, whose patience and teaching skills are highly recommended."

