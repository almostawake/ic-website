- name: Eden
  horse: Missy
  image: testimonial-eden.jpg
  alt: "Eden laughing as her horse Missy eats from her hand at sunset"
  herald:
    - "She treats my horse Missy as if she were her own, always putting her wellbeing first and making thoughtful decisions that reflect her experience and dedication. That level of care gives me so much trust in her and puts me at ease knowing my horse is being taken care of properly while I'm in Sydney."
  full:
    - "I can honestly say that ever since being part of Inner Circle and being guided by Nat, my riding has completely transformed. Nat has an incredible ability to break things down and explain them in a way that just clicks. No matter how complex something feels, she always finds a way to make it easy to understand, which has made such a difference in my progress."
    - "She constantly pushes you to be the best rider you can be, while still making you feel supported every step of the way. She truly cares, not just about your riding, but about you as a person, and that shows in everything she does."
    - "What truly sets her apart is how much she genuinely cares, not just about her riders, but about the horses as well. She treats my horse Missy as if she were her own, always putting her wellbeing first. That level of care puts me at ease knowing my horse is being taken care of properly while I'm in Sydney."
    - "She has created such a welcoming and supportive environment at the yard. It's a place where you feel comfortable, encouraged, and motivated, no matter your level. I always look forward to going there — it's not just about riding, it's about being part of a positive and friendly atmosphere."
    - "I feel incredibly lucky to train with someone so knowledgeable, passionate, and genuinely invested in both horse and rider. She has made me a better rider in every sense."

- name: Rachel
  horse: Wylie
  image: testimonial-rachel.jpg
  alt: "Rachel smiling from the saddle on her horse Wylie in the arena"
  herald:
    - "As someone who came to riding and horse ownership later in life, I needed a place that made me feel welcomed, not judged. Inner Circle has been that, and so much more."
    - "Natalie knows my horse and she knows me, helping me develop horsemanship and partnership as I grow with my horse."
  full:
    - "As someone who came to riding and horse ownership later in life, I needed a place that made me feel welcomed, not judged. Inner Circle has been that, and so much more."
    - "The agistment is exceptional — safe, clean, and thoughtfully run — but it's the training that has truly helped me. Natalie Innes has an incredible ability to build confidence while still pushing you to grow. She knows my horse and she knows me, helping me develop horsemanship and partnership as I grow with my horse."
    - "I've found strength, joy, and a whole new supportive community here. I have been with Inner Circle for three years, and in that time I've participated in fun days, dressage competitions and ridden out on trails."
    - "I am grateful every time I drive through the gates."

- name: Jeri
  horse: Wilbur
  image: testimonial-jeri.jpg
  alt: "Jeri riding Wilbur cross-country at Harden Horse Trials 2025"
  herald:
    - "I hadn't ridden in over 20 years and came back feeling unfit, rusty, and honestly not sure where to begin. Natalie completely changed that — she took me from 'I can't remember how to ride' to competing in eventing, and loving it."
  full:
    - "I've been riding with Natalie since 2021, and from our very first lesson I knew she was different."
    - "I hadn't ridden in over 20 years and came back feeling unfit, rusty, and honestly not sure where to begin. Natalie completely changed that. She tailored every lesson to me, helped me find a horse to lease, and supported me every step of the way back into the sport."
    - "She took me from 'I can't remember how to ride' to competing in eventing — and loving it. Being there at my first competition in 25 years, helping calm my nerves, warm us up, and guide me through the day, meant more than I can put into words."
    - "What makes Natalie truly special is that she's not just a coach — she becomes a friend. She's built an incredible community of supportive, like-minded people who simply love spending time with their horses. No matter your goals, you feel like you belong."
