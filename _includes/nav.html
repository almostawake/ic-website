<nav
  x-data="{ scrolled: false }"
  x-init="window.addEventListener('scroll', () => { scrolled = window.scrollY > 50 })"
  :class="scrolled ? 'bg-ic-cream/90 backdrop-blur-md border-b border-[rgba(28,40,86,0.1)]' : 'bg-transparent border-b border-transparent'"
  class="fixed top-0 w-full z-50 transition-all duration-300"
>
  <div class="max-w-[1200px] mx-auto px-8 py-4 flex items-center justify-between">
    <a href="{{ '/' | relative_url }}" class="group flex items-center gap-3">
      <img
        :src="scrolled ? '{{ '/brand/logo/ice-logo-icon.svg' | relative_url }}' : '{{ '/brand/logo/ice-logo-icon-reverse.svg' | relative_url }}'"
        alt="Inner Circle Equestrian"
        class="w-11 h-11 transition-opacity"
      >
      <span class="flex flex-col leading-none">
        <span :class="scrolled ? 'text-ic-navy' : 'text-white'" class="font-display text-3xl font-normal tracking-tight transition-colors">
          Inner Circle
        </span>
        <span :class="scrolled ? 'text-ic-steel' : 'text-white/70'" class="font-sans text-[0.94rem] font-normal tracking-[0.22em] uppercase mt-1 transition-colors">
          Equestrian
        </span>
      </span>
    </a>

    <!-- Desktop nav -->
    <div class="hidden md:flex items-center gap-8">
      <a href="#about" :class="scrolled ? 'text-ic-text hover:text-ic-navy' : 'text-white/85 hover:text-white'" class="font-sans text-sm font-medium tracking-[0.04em] uppercase transition">About</a>
      <a href="#services" :class="scrolled ? 'text-ic-text hover:text-ic-navy' : 'text-white/85 hover:text-white'" class="font-sans text-sm font-medium tracking-[0.04em] uppercase transition">Services</a>
      <a href="#testimonials" :class="scrolled ? 'text-ic-text hover:text-ic-navy' : 'text-white/85 hover:text-white'" class="font-sans text-sm font-medium tracking-[0.04em] uppercase transition">Community</a>
      <a href="#facilities" :class="scrolled ? 'text-ic-text hover:text-ic-navy' : 'text-white/85 hover:text-white'" class="font-sans text-sm font-medium tracking-[0.04em] uppercase transition">Facilities</a>
      <a href="#contact" x-show="scrolled" x-transition class="bg-ic-navy text-white hover:bg-ic-navy/90 text-sm font-medium tracking-[0.04em] uppercase px-5 py-2.5 rounded-brand transition">
        Get in Touch
      </a>
    </div>

    <!-- Mobile hamburger -->
    <button @click="mobileMenu = !mobileMenu" :class="scrolled ? 'text-ic-ash hover:text-ic-navy' : 'text-white/80 hover:text-white'" class="md:hidden">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path x-show="!mobileMenu" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        <path x-show="mobileMenu" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Mobile menu -->
  <div x-show="mobileMenu" x-transition class="md:hidden px-8 pb-6 space-y-4 bg-ic-cream border-b border-[rgba(28,40,86,0.1)]">
    <a href="#about" @click="mobileMenu = false" class="block text-ic-ash hover:text-ic-navy text-sm font-medium tracking-wide transition">About</a>
    <a href="#services" @click="mobileMenu = false" class="block text-ic-ash hover:text-ic-navy text-sm font-medium tracking-wide transition">Services</a>
    <a href="#testimonials" @click="mobileMenu = false" class="block text-ic-ash hover:text-ic-navy text-sm font-medium tracking-wide transition">Community</a>
    <a href="#facilities" @click="mobileMenu = false" class="block text-ic-ash hover:text-ic-navy text-sm font-medium tracking-wide transition">Facilities</a>
    <a href="#contact" @click="mobileMenu = false" class="block text-ic-navy font-semibold text-sm tracking-wide">Get in Touch</a>
  </div>
</nav>
