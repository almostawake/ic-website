<style>
:root {
  --ic-navy: #1C2856;
  --ic-steel: #4A5A8F;
  --ic-sky: #7FA3C1;
  --ic-gold: #B8976A;
  --ic-cream: #F5F0E8;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-ui: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: var(--ic-navy);
  color: white;
}

/* Background image */
.bg-image {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.bg-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 25% 20%;
}

/* Overlay — navy gradient for text readability */
.bg-overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    radial-gradient(ellipse 120% 100% at 30% 50%, rgba(28, 40, 86, 0.85) 0%, rgba(28, 40, 86, 0.55) 50%, rgba(28, 40, 86, 0.3) 100%),
    linear-gradient(135deg, rgba(28, 40, 86, 0.7) 0%, rgba(28, 40, 86, 0.2) 100%);
}

/* Floating circle motifs */
.circle-motif {
  position: absolute;
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: 50%;
  z-index: 2;
  pointer-events: none;
}
.circle-motif:nth-child(1) {
  width: 500px; height: 500px;
  top: -120px; right: -80px;
  animation: drift 25s ease-in-out infinite;
}
.circle-motif:nth-child(2) {
  width: 350px; height: 350px;
  bottom: -80px; left: -60px;
  animation: drift 30s ease-in-out infinite reverse;
}
.circle-motif:nth-child(3) {
  width: 180px; height: 180px;
  top: 20%; left: 8%;
  border-color: rgba(255, 255, 255, 0.025);
  animation: drift 20s ease-in-out infinite;
}

@keyframes drift {
  0%, 100% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.04); }
}

/* Content */
.content {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 2rem;
  max-width: 600px;
}

/* Horse mark with breathing animation */
.mark {
  width: 90px;
  height: 90px;
  margin: 0 auto 2.5rem;
  animation: breathe 4s ease-in-out infinite, fade-in 1.2s ease-out 0.3s both;
}
.mark svg {
  width: 100%;
  height: 100%;
}

@keyframes breathe {
  0%, 100% { transform: scale(1); opacity: 0.85; }
  50% { transform: scale(1.06); opacity: 1; }
}

@keyframes fade-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand-name {
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 6vw, 3.8rem);
  font-weight: 300;
  line-height: 1.08;
  letter-spacing: -0.01em;
  color: white;
  margin-bottom: 0.6rem;
  animation: fade-in 1s ease-out 0.6s both;
}

.brand-sub {
  font-family: var(--font-ui);
  font-size: clamp(0.55rem, 1.2vw, 0.7rem);
  font-weight: 300;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ic-sky);
  margin-bottom: 2.5rem;
  animation: fade-in 1s ease-out 0.8s both;
}

.coming {
  font-family: var(--font-display);
  font-size: clamp(1.1rem, 2.5vw, 1.5rem);
  font-weight: 300;
  font-style: italic;
  color: rgba(255, 255, 255, 0.55);
  margin-bottom: 1.2rem;
  animation: fade-in 1s ease-out 1s both;
}

.byline {
  font-family: var(--font-display);
  font-size: clamp(0.85rem, 1.8vw, 1.05rem);
  font-weight: 300;
  font-style: italic;
  color: rgba(255, 255, 255, 0.45);
  margin-bottom: 3rem;
  animation: fade-in 1s ease-out 1.2s both;
}

/* Divider line */
.divider {
  width: 50px;
  height: 1px;
  background: var(--ic-gold);
  margin: 0 auto 2rem;
  opacity: 0.8;
  animation: fade-in 1s ease-out 1.4s both;
}

/* Contact info */
.contact {
  animation: fade-in 1s ease-out 1.6s both;
}
.contact a {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.6);
  text-decoration: none;
  letter-spacing: 0.03em;
  transition: color 0.3s ease;
}
.contact a:hover {
  color: var(--ic-gold);
}
.contact .sep {
  color: rgba(255, 255, 255, 0.25);
  margin: 0 0.8rem;
}
.contact .location {
  display: block;
  margin-top: 0.8rem;
  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 300;
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.3);
}

/* Mobile adjustments */
@media (max-width: 640px) {
  .bg-image img { object-position: 30% 15%; }
  .mark { width: 70px; height: 70px; margin-bottom: 2rem; }
  .content { padding: 1.5rem; }
  .contact .sep { display: none; }
  .contact a { display: block; margin-bottom: 0.5rem; }
}
</style>
