- name: Eden
  horse: Missy
  image: testimonial-eden.jpg
  alt: "Eden laughing as her horse Missy eats from her hand at sunset"
  herald:
    - "She treats my horse Missy as if she were her own, always putting her wellbeing first and making thoughtful decisions that reflect her experience and dedication. That level of care gives me so much trust in her and puts me at ease knowing my horse is being taken care of properly while I'm in Sydney."
  full:
    - "I can honestly say that ever since being part of Inner Circle and being guided by Nat, my riding has completely transformed. Nat has an incredible ability to break things down and explain them in a way that just clicks. No matter how complex something feels, she always finds a way to make it easy to understand, which has made such a difference in my progress."
    - "She constantly pushes you to be the best rider you can be, while still making you feel supported every step of the way. She truly cares, not just about your riding, but about you as a person, and that shows in everything she does."
    - "What truly sets her apart is how much she genuinely cares, not just about her riders, but about the horses as well. She treats my horse Missy as if she were her own, always putting her wellbeing first. That level of care puts me at ease knowing my horse is being taken care of properly while I'm in Sydney."
    - "She has created such a welcoming and supportive environment at the yard. It's a place where you feel comfortable, encouraged, and motivated, no matter your level. I always look forward to going there — it's not just about riding, it's about being part of a positive and friendly atmosphere."
    - "I feel incredibly lucky to train with someone so knowledgeable, passionate, and genuinely invested in both horse and rider. She has made me a better rider in every sense."
